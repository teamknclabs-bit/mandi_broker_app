name: NCDEX Market Watch Sync

on:
  schedule:
    # Runs every 5 minutes (Monday to Friday, 03:30 to 12:30 UTC / 09:00 to 18:00 IST)
    - cron: '*/5 3-12 * * 1-5'
  workflow_dispatch:

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: scripts/ncdex_updater
        run: npm install

      - name: Run NCDEX Live Scraper
        working-directory: scripts/ncdex_updater
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node fetch_ncdex.js
        