name: NCDEX Live Sync

on:
  schedule:
    # 09:00 AM & 09:15 AM IST (03:30 & 03:45 UTC), Monday - Friday
    - cron: '30,45 3 * * 1-5'
    # Every 15 mins between 09:30 AM - 05:00 PM IST (04:00 - 11:30 UTC), Monday - Friday
    - cron: '*/15 4-11 * * 1-5'
  workflow_dispatch:

jobs:
  sync-rates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts/ncdex_updater
        run: |
          npm install
          npx puppeteer browsers install chrome

      - name: Run Scraper & Push to mandi-market-view
        working-directory: scripts/ncdex_updater
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets['serviceAccountKey.json'] || secrets.FIREBASE_SERVICE_KEY }}
        run: node fetch_ncdex.js