name: NCDEX Live Sync

on:
  schedule:
    # Triggers every hour from 09:00 AM to 05:00 PM IST (03:30 to 11:30 UTC), Monday - Friday
    - cron: '30 3-11 * * 1-5'
  workflow_dispatch:

jobs:
  sync-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: scripts/ncdex_updater
        run: npm install

      - name: Run 5-Min Sync Engine
        working-directory: scripts/ncdex_updater
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node fetch_ncdex.js
        