name: Sync NCDEX Bhav to Firestore

on:
  schedule:
    # Runs every 15 minutes between 03:30 UTC and 11:30 UTC (09:00 AM to 05:00 PM IST) Monday to Friday
    - cron: '*/15 3-11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          cd scripts/ncdex_updater
          npm install

      - name: Execute Bhav Sync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          cd scripts/ncdex_updater
          node fetch_ncdex.js

          